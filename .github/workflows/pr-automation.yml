name: PR Automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-by-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  label-by-size:
    runs-on: ubuntu-latest
    steps:
      - name: Compute and apply a size/* label from the diff
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changes = pr.additions + pr.deletions;

            const thresholds = [
              { max: 20, label: 'size/XS', color: 'c2e0c6' },
              { max: 100, label: 'size/S', color: '7bc47f' },
              { max: 400, label: 'size/M', color: 'f9d976' },
              { max: 1000, label: 'size/L', color: 'f0883e' },
              { max: Infinity, label: 'size/XL', color: 'da3633' },
            ];
            const target = thresholds.find((t) => changes <= t.max).label;

            // The "add labels" API 404s on a label name that doesn't exist yet
            // in the repo — create each size/* label the first time it's needed.
            for (const { label, color } of thresholds) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color,
                  description: `Pull request changing ${label.split('/')[1]} lines of code`,
                });
              }
            }

            const sizeLabels = thresholds.map((t) => t.label);
            const current = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const staleSizeLabels = current.data
              .map((l) => l.name)
              .filter((name) => sizeLabels.includes(name) && name !== target);

            for (const name of staleSizeLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name,
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [target],
            });

            console.log(`PR #${pr.number}: ${changes} changed lines -> ${target}`);
